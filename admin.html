<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Ronin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Expanded:wght@700;800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0F1016; --panel:#181A24; --panel-hi:#22242F; --line:#2C2E3A;
    --paper:#F1EFE9; --paper-dim:#9C9CAA; --magenta:#FF3D7F; --cyan:#3FE0C5; --amber:#FFB84D; --radius:2px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ background:var(--ink); color:var(--paper); font-family:'Inter',sans-serif; -webkit-font-smoothing:antialiased; }
  .display{ font-family:'Archivo Expanded', sans-serif; font-weight:800; letter-spacing:-0.01em; }
  .mono{ font-family:'IBM Plex Mono', monospace; letter-spacing:0.02em; }
  a{ color:inherit; text-decoration:none; }
  ::selection{ background:var(--magenta); color:var(--ink); }
  a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible{ outline:2px solid var(--cyan); outline-offset:2px; }

  nav{
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 40px; border-bottom:1px solid var(--line);
  }
  .logo{ display:flex; align-items:center; gap:10px; font-size:20px; }
  .logo-mark{ width:13px; height:13px; background:var(--magenta); clip-path:polygon(0 0, 100% 50%, 0 100%); }
  .nav-links{ display:flex; gap:28px; font-size:13px; color:var(--paper-dim); }
  .nav-links a:hover{ color:var(--paper); }

  .wrap{ max-width:820px; margin:0 auto; padding:44px 40px 80px; }
  .page-title{ font-size:26px; margin-bottom:6px; }
  .page-sub{ font-size:13px; color:var(--paper-dim); margin-bottom:36px; }

  .layout{ display:grid; grid-template-columns:1.1fr 0.9fr; gap:32px; align-items:start; }
  @media (max-width:820px){ .layout{ grid-template-columns:1fr; } }

  form{ display:flex; flex-direction:column; gap:14px; }
  .field label{ display:block; font-size:12px; color:var(--paper-dim); margin-bottom:6px; }
  .field input, .field select, .field textarea{
    width:100%; background:var(--panel); border:1px solid var(--line); color:var(--paper);
    font-family:inherit; font-size:14px; padding:11px 12px; border-radius:var(--radius);
  }
  .field textarea{ resize:vertical; min-height:70px; }
  .field-row{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .swatch-row{ display:flex; align-items:center; gap:10px; }
  .swatch-row input[type=color]{ width:44px; height:38px; padding:2px; cursor:pointer; }

  .submit-btn{
    margin-top:8px; padding:13px 20px; background:var(--paper); color:var(--ink);
    border:none; border-radius:var(--radius); cursor:pointer; font-family:inherit; font-weight:600; font-size:14px;
  }
  .submit-btn:hover{ background:#fff; }
  .submit-btn:disabled{ opacity:0.5; cursor:default; }

  .status-msg{ font-size:13px; padding:10px 12px; border-radius:var(--radius); display:none; }
  .status-msg.show{ display:block; }
  .status-msg.ok{ background:rgba(63,224,197,0.12); color:var(--cyan); border:1px solid rgba(63,224,197,0.3); }
  .status-msg.err{ background:rgba(255,61,127,0.12); color:var(--magenta); border:1px solid rgba(255,61,127,0.3); }

  .preview-card{ background:var(--panel); border:1px solid var(--line); position:sticky; top:44px; }
  .preview-art{
    height:160px; display:flex; align-items:flex-start; justify-content:flex-end; padding:12px;
    background:linear-gradient(155deg, var(--a, #3a2140), var(--b, #141018));
  }
  .preview-glyph{ font-size:28px; font-weight:800; opacity:0.35; }
  .preview-body{ padding:14px 16px 18px; }
  .preview-name{ font-size:15px; font-weight:600; margin-bottom:4px; }
  .preview-tag{ font-size:12px; color:var(--paper-dim); margin-bottom:10px; }
  .preview-meta{ display:flex; gap:8px; flex-wrap:wrap; }
  .preview-pill{ font-size:10px; border:1px solid var(--line); padding:3px 8px; border-radius:var(--radius); color:var(--paper-dim); }

  .catalog-list{ margin-top:44px; }
  .catalog-title{ font-size:16px; margin-bottom:14px; }
  .catalog-row{
    display:flex; align-items:center; gap:12px; padding:10px 0; border-bottom:1px solid var(--line); font-size:13px;
  }
  .catalog-row:last-child{ border-bottom:none; }
  .catalog-art{ width:40px; height:40px; border-radius:var(--radius); flex-shrink:0; background:linear-gradient(155deg, var(--a), var(--b)); }
  .catalog-name{ flex:1; }
  .catalog-tag{ color:var(--paper-dim); font-size:11px; }
</style>
</head>
<body>

<nav>
  <a href="index.html"><div class="logo"><span class="logo-mark"></span><span class="display">RONIN</span></div></a>
  <div class="nav-links">
    <a href="index.html">Home</a>
    <a href="search.html">Browse</a>
  </div>
</nav>

<div class="wrap">
  <div class="page-title display">Admin · Add a Title</div>
  <div class="page-sub mono">Writes directly to the shared RINO catalog — visible to every visitor immediately.</div>

  <div class="layout">
    <form id="addForm">
      <div class="field">
        <label for="fTitle">Title</label>
        <input type="text" id="fTitle" required placeholder="e.g. Hollow Reef">
      </div>

      <div class="field-row">
        <div class="field">
          <label for="fTag">Short category (tag)</label>
          <input type="text" id="fTag" required placeholder="e.g. Mecha">
        </div>
        <div class="field">
          <label for="fGenre">Descriptive genre</label>
          <input type="text" id="fGenre" required placeholder="e.g. Mecha · War Drama">
        </div>
      </div>

      <div class="field">
        <label for="fDesc">Description</label>
        <textarea id="fDesc" placeholder="One or two sentences…"></textarea>
      </div>

      <div class="field-row">
        <div class="field">
          <label for="fEpisodes">Episodes</label>
          <input type="number" id="fEpisodes" min="1" value="12">
        </div>
        <div class="field">
          <label for="fRating">Rating</label>
          <select id="fRating">
            <option>All</option>
            <option selected>13+</option>
            <option>16+</option>
            <option>18+</option>
          </select>
        </div>
      </div>

      <div class="field">
        <label for="fGlyph">Glyph (single character shown on the art)</label>
        <input type="text" id="fGlyph" maxlength="2" placeholder="e.g. 影" value="?">
      </div>

      <div class="field">
        <label>Art gradient</label>
        <div class="swatch-row">
          <input type="color" id="fColorA" value="#3a2140">
          <input type="color" id="fColorB" value="#141018">
          <span class="mono" style="font-size:12px; color:var(--paper-dim);">start → end</span>
        </div>
      </div>

      <button type="submit" class="submit-btn" id="submitBtn">Add to catalog</button>
      <div class="status-msg" id="statusMsg"></div>
    </form>

    <div class="preview-card" id="previewCard">
      <div class="preview-art" id="previewArt"><div class="preview-glyph" id="previewGlyph">?</div></div>
      <div class="preview-body">
        <div class="preview-name" id="previewName">New title</div>
        <div class="preview-tag" id="previewTag">Category</div>
        <div class="preview-meta">
          <span class="preview-pill" id="previewEps">12 EPISODES</span>
          <span class="preview-pill" id="previewRating">13+</span>
        </div>
      </div>
    </div>
  </div>

  <div class="catalog-list">
    <div class="catalog-title display">Current catalog</div>
    <div id="catalogRows" class="mono" style="color:var(--paper-dim); font-size:12px;">Loading…</div>
  </div>
</div>

<script src="supabaseClient.js"></script>
<script>
  const fields = ['fTitle','fTag','fGenre','fDesc','fEpisodes','fRating','fGlyph','fColorA','fColorB'];

  function updatePreview(){
    document.getElementById('previewName').textContent = document.getElementById('fTitle').value || 'New title';
    document.getElementById('previewTag').textContent = document.getElementById('fGenre').value || 'Category';
    document.getElementById('previewGlyph').textContent = document.getElementById('fGlyph').value || '?';
    document.getElementById('previewEps').textContent = `${document.getElementById('fEpisodes').value || 0} EPISODES`;
    document.getElementById('previewRating').textContent = document.getElementById('fRating').value;
    document.getElementById('previewArt').style.setProperty('--a', document.getElementById('fColorA').value);
    document.getElementById('previewArt').style.setProperty('--b', document.getElementById('fColorB').value);
  }
  fields.forEach(id => document.getElementById(id).addEventListener('input', updatePreview));
  updatePreview();

  async function loadCatalogList(){
    const rowsEl = document.getElementById('catalogRows');
    try{
      const shows = await fetchShows();
      if(shows.length === 0){
        rowsEl.innerHTML = 'No titles yet.';
        return;
      }
      rowsEl.className = '';
      rowsEl.innerHTML = shows.map(s => `
        <div class="catalog-row">
          <div class="catalog-art" style="--a:${s.a}; --b:${s.b};"></div>
          <div class="catalog-name">${s.t}</div>
          <div class="catalog-tag">${s.genre} · ${s.eps} eps</div>
        </div>
      `).join('');
    } catch(err){
      console.error(err);
      rowsEl.innerHTML = "Couldn't load the catalog.";
    }
  }

  document.getElementById('addForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const statusEl = document.getElementById('statusMsg');
    const btn = document.getElementById('submitBtn');
    statusEl.className = 'status-msg';
    btn.disabled = true;
    btn.textContent = 'Adding…';

    const payload = {
      title: document.getElementById('fTitle').value.trim(),
      tag: document.getElementById('fTag').value.trim(),
      genre: document.getElementById('fGenre').value.trim(),
      description: document.getElementById('fDesc').value.trim(),
      episodes: parseInt(document.getElementById('fEpisodes').value, 10) || 1,
      rating: document.getElementById('fRating').value,
      glyph: document.getElementById('fGlyph').value.trim() || '?',
      color_a: document.getElementById('fColorA').value,
      color_b: document.getElementById('fColorB').value
    };

    try{
      await insertShow(payload);
      statusEl.textContent = `"${payload.title}" was added to the catalog.`;
      statusEl.className = 'status-msg show ok';
      document.getElementById('addForm').reset();
      document.getElementById('fEpisodes').value = 12;
      document.getElementById('fColorA').value = '#3a2140';
      document.getElementById('fColorB').value = '#141018';
      updatePreview();
      loadCatalogList();
    } catch(err){
      console.error(err);
      statusEl.textContent = "Couldn't add that title — it may already exist, or check your connection.";
      statusEl.className = 'status-msg show err';
    } finally {
      btn.disabled = false;
      btn.textContent = 'Add to catalog';
    }
  });

  loadCatalogList();
</script>
</body>
</html>
