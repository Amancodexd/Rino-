<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Profile — Ronin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Expanded:wght@700;800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0F1016; --panel:#181A24; --panel-hi:#22242F; --line:#2C2E3A;
    --paper:#F1EFE9; --paper-dim:#9C9CAA; --magenta:#FF3D7F; --cyan:#3FE0C5; --amber:#FFB84D; --radius:2px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--ink); color:var(--paper); font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .display{ font-family:'Archivo Expanded', sans-serif; font-weight:800; }
  .mono{ font-family:'IBM Plex Mono', monospace; letter-spacing:0.02em; }
  a{ color:inherit; text-decoration:none; }
  ::selection{ background:var(--magenta); color:var(--ink); }
  a:focus-visible, button:focus-visible{ outline:2px solid var(--cyan); outline-offset:2px; }

  nav{
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 40px; border-bottom:1px solid var(--line);
  }
  .logo{ display:flex; align-items:center; gap:10px; font-size:20px; }
  .logo-mark{ width:13px; height:13px; background:var(--magenta); clip-path:polygon(0 0, 100% 50%, 0 100%); }
  .nav-links{ display:flex; gap:28px; font-size:13px; color:var(--paper-dim); }
  .nav-links a:hover{ color:var(--paper); }
  .signout{ font-size:13px; color:var(--paper-dim); cursor:pointer; background:none; border:none; font-family:inherit; }
  .signout:hover{ color:var(--magenta); }

  .header-block{
    padding:48px 40px 32px; display:flex; gap:24px; align-items:center;
    border-bottom:1px solid var(--line);
    background:radial-gradient(ellipse at 85% 0%, rgba(255,61,127,0.1), transparent 55%);
  }
  .avatar-big{
    width:84px; height:84px; border-radius:50%;
    background:linear-gradient(155deg, var(--magenta), var(--cyan));
    display:flex; align-items:center; justify-content:center;
    font-size:30px; font-weight:800; color:var(--ink); flex-shrink:0;
  }
  .who-name{ font-size:28px; margin-bottom:4px; }
  .who-email{ font-size:13px; color:var(--paper-dim); }
  .who-tags{ display:flex; gap:10px; margin-top:12px; }
  .tag{ font-size:11px; border:1px solid var(--line); padding:4px 10px; border-radius:var(--radius); color:var(--paper-dim); }

  .stat-row{
    display:flex; gap:1px; background:var(--line); border:1px solid var(--line); margin:0 40px; margin-top:-1px;
  }
  .stat{ flex:1; background:var(--panel); padding:20px 24px; }
  .stat-num{ font-size:26px; margin-bottom:2px; }
  .stat-label{ font-size:11px; color:var(--paper-dim); }

  .section{ padding:40px; }
  .section-title{ font-size:18px; margin-bottom:18px; }

  .hist-row{
    display:flex; align-items:center; gap:16px; padding:14px 0; border-bottom:1px solid var(--line);
  }
  .hist-row:last-child{ border-bottom:none; }
  .hist-art{
    width:64px; height:44px; flex-shrink:0; border-radius:var(--radius);
    background:linear-gradient(155deg, var(--a), var(--b));
  }
  .hist-info{ flex:1; min-width:0; }
  .hist-title{ font-size:14px; font-weight:600; margin-bottom:3px; }
  .hist-ep{ font-size:11px; color:var(--paper-dim); }
  .hist-bar{ width:120px; height:3px; background:var(--line); border-radius:2px; overflow:hidden; flex-shrink:0; }
  .hist-bar-fill{ height:100%; background:var(--cyan); }
  .hist-time{ font-size:11px; color:var(--paper-dim); width:60px; text-align:right; flex-shrink:0; }

  .settings-grid{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  @media (max-width:700px){ .settings-grid{ grid-template-columns:1fr; } }
  .setting-card{ background:var(--panel); border:1px solid var(--line); padding:18px; }
  .setting-name{ font-size:13px; font-weight:600; margin-bottom:4px; }
  .setting-desc{ font-size:12px; color:var(--paper-dim); }

  /* My List tracker */
  .list-head-row{ display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; }
  .add-title-btn{
    font-size:12px; padding:9px 16px; background:var(--paper); color:var(--ink);
    border:none; border-radius:var(--radius); cursor:pointer; font-family:inherit; font-weight:600;
  }
  .add-title-btn:hover{ background:#fff; }

  .tab-row{ display:flex; gap:6px; margin-bottom:22px; flex-wrap:wrap; }
  .tab{
    font-size:12px; padding:9px 15px; border:1px solid var(--line); border-radius:20px;
    color:var(--paper-dim); cursor:pointer; background:none; font-family:inherit;
    display:flex; align-items:center; gap:7px;
  }
  .tab:hover{ border-color:var(--paper-dim); color:var(--paper); }
  .tab.active{ background:var(--paper); color:var(--ink); border-color:var(--paper); }
  .tab .cnt{ font-size:10px; opacity:0.65; }
  .tab.active .cnt{ opacity:0.55; }

  .list-grid{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(180px, 1fr)); gap:18px;
  }
  .list-card{ background:var(--panel); border:1px solid var(--line); overflow:hidden; }
  .list-card-art{
    position:relative; height:150px;
    background:linear-gradient(155deg, var(--a), var(--b));
    display:flex; align-items:flex-start; justify-content:flex-end; padding:10px;
  }
  .list-card-glyph{ font-size:24px; font-weight:800; opacity:0.35; }
  .list-card-body{ padding:12px 14px 14px; }
  .list-card-title{ font-size:13px; font-weight:600; margin-bottom:8px; }
  .status-select{
    width:100%; background:var(--ink); border:1px solid var(--line); color:var(--paper);
    font-size:11px; padding:7px 8px; border-radius:var(--radius); font-family:inherit; margin-bottom:8px;
  }
  .list-card-remove{
    width:100%; background:none; border:1px solid var(--line); color:var(--paper-dim);
    font-size:11px; padding:6px; border-radius:var(--radius); cursor:pointer; font-family:inherit;
  }
  .list-card-remove:hover{ border-color:var(--magenta); color:var(--magenta); }

  .list-empty{
    padding:50px 20px; text-align:center; color:var(--paper-dim); font-size:13px;
    border:1px dashed var(--line);
  }
  .list-empty a{ color:var(--cyan); cursor:pointer; }

  /* Add title modal */
  .modal-bg{
    position:fixed; inset:0; background:rgba(10,10,14,0.85);
    display:none; align-items:center; justify-content:center; z-index:100; padding:20px;
  }
  .modal-bg.open{ display:flex; }
  .add-modal{
    width:min(560px, 100%); max-height:80vh; background:var(--panel); border:1px solid var(--line);
    display:flex; flex-direction:column;
  }
  .add-modal-head{
    padding:18px 20px; border-bottom:1px solid var(--line);
    display:flex; align-items:center; justify-content:space-between;
  }
  .add-modal-title{ font-size:16px; }
  .add-modal-close{
    background:none; border:none; color:var(--paper-dim); font-size:16px; cursor:pointer;
  }
  .add-modal-list{ overflow-y:auto; padding:10px; }
  .add-modal-item{
    display:flex; align-items:center; gap:12px; padding:10px 10px;
    cursor:pointer; border-radius:var(--radius);
  }
  .add-modal-item:hover{ background:var(--panel-hi); }
  .add-modal-art{
    width:44px; height:44px; flex-shrink:0; border-radius:var(--radius);
    background:linear-gradient(155deg, var(--a), var(--b));
  }
  .add-modal-info{ flex:1; }
  .add-modal-name{ font-size:13px; font-weight:600; }
  .add-modal-tag{ font-size:11px; color:var(--paper-dim); }
  .add-modal-plus{ font-size:18px; color:var(--cyan); }
  .add-modal-item.disabled{ opacity:0.35; cursor:default; }
  .add-modal-item.disabled:hover{ background:none; }

  .locked{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    min-height:60vh; text-align:center; padding:40px; gap:16px;
  }
  .locked .btn-primary{
    padding:12px 24px; background:var(--paper); color:var(--ink); border:none;
    font-size:14px; font-weight:600; border-radius:var(--radius); cursor:pointer;
  }
</style>
<script src="supabaseClient.js"></script>
</head>
<body>

<div id="app"></div>

<script>
  const raw = sessionStorage.getItem('ronin_session');

  if(!raw){
    document.getElementById('app').innerHTML = `
      <div class="locked">
        <div class="display" style="font-size:26px;">You're not signed in</div>
        <div style="color:var(--paper-dim); font-size:14px; max-width:360px;">Sign in to see your watch history, continue-watching progress, and account settings.</div>
        <a href="login.html"><button class="btn-primary">Go to sign in</button></a>
      </div>`;
  } else {
    initProfile();
  }

  async function initProfile(){
    const session = JSON.parse(raw);
    const initial = session.name.charAt(0).toUpperCase();

    document.getElementById('app').innerHTML = `<div style="padding:100px 40px; text-align:center; color:var(--paper-dim);">Loading…</div>`;

    // Full catalog, shared across the app — used to populate the "Add title" picker
    let catalog;
    try{
      catalog = await fetchShows();
    } catch(err){
      console.error(err);
      document.getElementById('app').innerHTML = `<div class="locked"><div class="display" style="font-size:22px;">Couldn't load the catalog</div><div style="color:var(--paper-dim); font-size:14px;">Check your connection and refresh.</div></div>`;
      return;
    }

    const history = [
      {t:"Iron Requiem", ep:"S2E12 · 18 min left", pct:72, a:"#3a2140", b:"#141018", time:"Today"},
      {t:"Void Marchers", ep:"S3E20 · Finished", pct:100, a:"#241f3a", b:"#100e1c", time:"Yesterday"},
      {t:"Static Blossom", ep:"S1E8 · 6 min left", pct:88, a:"#1f3a4a", b:"#0e1620", time:"Mon"},
      {t:"Umbra Academy", ep:"S1E15 · Just started", pct:8, a:"#3a1f2e", b:"#180e14", time:"Sun"},
    ];

    const statuses = ["Watching", "Plan to Watch", "On Hold", "Completed", "Dropped"];
    const listKey = 'ronin_list_' + session.email;
    let myList = JSON.parse(localStorage.getItem(listKey) || 'null');
    if(myList === null){
      // First visit for this account — seed a few entries so the section isn't empty
      myList = {
        "Iron Requiem": "Watching",
        "Void Marchers": "Completed",
        "Ashfall Chronicle": "Plan to Watch",
        "Crimson Threshold": "Dropped",
      };
      localStorage.setItem(listKey, JSON.stringify(myList));
    }
    let activeTab = "Watching";

    function saveList(){ localStorage.setItem(listKey, JSON.stringify(myList)); }

    function renderTabs(){
      return statuses.map(s => {
        const count = Object.values(myList).filter(v => v === s).length;
        return `<button class="tab ${activeTab===s?'active':''}" onclick="setTab('${s}')">${s} <span class="cnt mono">${count}</span></button>`;
      }).join('');
    }

    function renderListGrid(){
      const titlesInTab = Object.keys(myList).filter(t => myList[t] === activeTab);
      if(titlesInTab.length === 0){
        return `<div class="list-empty">Nothing in <strong>${activeTab}</strong> yet. <a onclick="openAddModal()">Add a title</a> to get started.</div>`;
      }
      return `<div class="list-grid">${titlesInTab.map(t => {
        const c = catalog.find(c => c.t === t);
        if(!c) return '';
        return `<div class="list-card">
          <div class="list-card-art" style="--a:${c.a}; --b:${c.b};"><div class="list-card-glyph">${c.glyph}</div></div>
          <div class="list-card-body">
            <div class="list-card-title">${c.t}</div>
            <select class="status-select" onchange="changeStatus('${c.t}', this.value)">
              ${statuses.map(s => `<option value="${s}" ${s===myList[t]?'selected':''}>${s}</option>`).join('')}
            </select>
            <button class="list-card-remove" onclick="removeFromList('${c.t}')">Remove</button>
          </div>
        </div>`;
      }).join('')}</div>`;
    }

    function renderListSection(){
      document.getElementById('tabRow').innerHTML = renderTabs();
      document.getElementById('listGrid').innerHTML = renderListGrid();
    }

    window.setTab = function(s){ activeTab = s; renderListSection(); };
    window.changeStatus = function(title, status){ myList[title] = status; saveList(); renderListSection(); };
    window.removeFromList = function(title){ delete myList[title]; saveList(); renderListSection(); };

    window.openAddModal = function(){
      const notAdded = catalog.filter(c => !myList[c.t]);
      const added = catalog.filter(c => myList[c.t]);
      document.getElementById('addModalList').innerHTML = [
        ...notAdded.map(c => `
          <div class="add-modal-item" onclick="quickAdd('${c.t}')">
            <div class="add-modal-art" style="--a:${c.a}; --b:${c.b};"></div>
            <div class="add-modal-info"><div class="add-modal-name">${c.t}</div><div class="add-modal-tag">${c.tag}</div></div>
            <div class="add-modal-plus">+</div>
          </div>`),
        ...added.map(c => `
          <div class="add-modal-item disabled">
            <div class="add-modal-art" style="--a:${c.a}; --b:${c.b};"></div>
            <div class="add-modal-info"><div class="add-modal-name">${c.t}</div><div class="add-modal-tag">Already in ${myList[c.t]}</div></div>
          </div>`)
      ].join('');
      document.getElementById('addModalBg').classList.add('open');
    };
    window.closeAddModal = function(){ document.getElementById('addModalBg').classList.remove('open'); };
    window.quickAdd = function(title){
      myList[title] = "Plan to Watch";
      saveList();
      activeTab = "Plan to Watch";
      renderListSection();
      closeAddModal();
    };

    document.getElementById('app').innerHTML = `
      <nav>
        <a href="index.html"><div class="logo"><span class="logo-mark"></span><span class="display">RONIN</span></div></a>
        <div class="nav-links">
          <a href="index.html">Home</a>
          <a href="index.html#schedule">Schedule</a>
          <a href="index.html#catalog">Browse</a>
        </div>
        <button class="signout" onclick="signOut()">Sign out</button>
      </nav>

      <div class="header-block">
        <div class="avatar-big">${initial}</div>
        <div>
          <div class="who-name display">${session.name}</div>
          <div class="who-email mono">${session.email}</div>
          <div class="who-tags">
            <span class="tag">Free plan</span>
            <span class="tag">Member since demo</span>
          </div>
        </div>
      </div>

      <div class="stat-row">
        <div class="stat"><div class="stat-num display">142</div><div class="stat-label mono">EPISODES WATCHED</div></div>
        <div class="stat"><div class="stat-num display">58h</div><div class="stat-label mono">TOTAL WATCH TIME</div></div>
        <div class="stat"><div class="stat-num display">9</div><div class="stat-label mono">SHOWS IN PROGRESS</div></div>
      </div>

      <div class="section">
        <div class="section-title display">Continue Watching</div>
        ${history.map(h => `
          <div class="hist-row">
            <div class="hist-art" style="--a:${h.a}; --b:${h.b};"></div>
            <div class="hist-info">
              <div class="hist-title">${h.t}</div>
              <div class="hist-ep mono">${h.ep}</div>
            </div>
            <div class="hist-bar"><div class="hist-bar-fill" style="width:${h.pct}%"></div></div>
            <div class="hist-time mono">${h.time}</div>
          </div>
        `).join('')}
      </div>

      <div class="section">
        <div class="list-head-row">
          <div class="section-title display">My List</div>
          <button class="add-title-btn" onclick="openAddModal()">+ Add title</button>
        </div>
        <div class="tab-row" id="tabRow"></div>
        <div id="listGrid"></div>
      </div>

      <div class="section">
        <div class="section-title display">Account Settings</div>
        <div class="settings-grid">
          <div class="setting-card">
            <div class="setting-name">Playback quality</div>
            <div class="setting-desc">Auto (adjusts to your connection)</div>
          </div>
          <div class="setting-card">
            <div class="setting-name">Subtitles</div>
            <div class="setting-desc">English · Always on</div>
          </div>
          <div class="setting-card">
            <div class="setting-name">Notifications</div>
            <div class="setting-desc">New episode alerts · Enabled</div>
          </div>
          <div class="setting-card">
            <div class="setting-name">Password</div>
            <div class="setting-desc">Last changed: never (demo account)</div>
          </div>
        </div>
      </div>

      <div class="modal-bg" id="addModalBg" onclick="if(event.target===this) closeAddModal()">
        <div class="add-modal">
          <div class="add-modal-head">
            <div class="add-modal-title display">Add to My List</div>
            <button class="add-modal-close" onclick="closeAddModal()">✕</button>
          </div>
          <div class="add-modal-list" id="addModalList"></div>
        </div>
      </div>
    `;

    renderListSection();
  }

  function signOut(){
    sessionStorage.removeItem('ronin_session');
    window.location.href = 'login.html';
  }
</script>
</body>
</html>
